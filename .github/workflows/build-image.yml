name: Build and publish image

# Builds the production image on a GitHub runner and pushes it to GHCR, so the
# VPS never has to build again.
#
# Background: the site was built on the VPS by nixpacks until that stopped
# working. A cold Next.js 16 build of ~410 routes does not fit in the memory the
# 7.9 GB box has spare while serving the live site and ~20 other containers, so
# `npm run build` was OOM-killed by the kernel — silently, at a different phase
# each run, with no error in the deploy log. Three weeks of commits never
# shipped. A GitHub runner has 16 GB and builds this in minutes.
#
# Coolify's build pack is set to "Docker Image" and simply pulls the tag this
# workflow publishes, which also drops deploy time from ~55 minutes to the time
# it takes to pull and restart.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Trigger the Coolify deploy after publishing"
        type: boolean
        default: true

# One build per branch; a newer push supersedes an in-flight one.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `main` is the tag Coolify pulls; the sha tag makes it possible to
          # roll back to an exact commit without a rebuild.
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache lives in the Actions cache, so an unchanged
          # package-lock.json skips the whole npm ci layer on later runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* are build args because Next inlines them into the
          # client bundle — they ship to every browser, so they are not secret
          # and baking them into image history costs nothing.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_POSTHOG_TOKEN=${{ secrets.NEXT_PUBLIC_POSTHOG_TOKEN }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_FACEBOOK_PIXEL_ID=${{ secrets.NEXT_PUBLIC_FACEBOOK_PIXEL_ID }}
            NEXT_PUBLIC_CHAT_ENABLED=${{ secrets.NEXT_PUBLIC_CHAT_ENABLED }}
          # The encryption key is a real secret, so it goes in as a BuildKit
          # secret instead — mounted for the build command only, never written
          # into a layer. It must be byte-identical to Coolify's runtime value
          # or every server action fails in production; the Dockerfile refuses
          # to build if it is missing.
          secrets: |
            next_server_actions_key=${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

      - name: Point Coolify at this exact image, then deploy
        # Skipped silently until COOLIFY_TOKEN exists, so image builds can be
        # verified before anything is allowed to touch production.
        #
        # IMAGE_REF is pinned to the immutable sha-<commit> tag rather than
        # :main. Coolify's deploy builds Dockerfile.deploy, which is just a FROM
        # — and a FROM against a moving tag would happily reuse whatever copy of
        # :main the VPS already had, silently deploying a stale image. A digest
        # -unique tag cannot be stale.
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: https://coolify.byteprima.com
          COOLIFY_APP_UUID: i5knr4obzv3hzjhrkl58rn12
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "COOLIFY_TOKEN not set — image published, deploy not triggered."
            exit 0
          fi

          echo "Pinning IMAGE_REF to $IMAGE_REF"
          # Create the variable, or update it if it already exists. Coolify
          # returns 4xx on create-when-present, so fall through to PATCH.
          curl -sS -X POST "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID/envs" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"IMAGE_REF\",\"value\":\"$IMAGE_REF\",\"is_buildtime\":true,\"is_runtime\":false}" \
            -o /dev/null -w 'create: HTTP %{http_code}\n' || true
          curl -sS -X PATCH "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID/envs" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"key\":\"IMAGE_REF\",\"value\":\"$IMAGE_REF\",\"is_buildtime\":true,\"is_runtime\":false}" \
            -o /dev/null -w 'update: HTTP %{http_code}\n'

          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X GET "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID" \
            -H "Authorization: Bearer $COOLIFY_TOKEN")
          echo "deploy trigger: HTTP $code"
          cat /tmp/deploy.json
          [ "$code" = "200" ]

  # The 2026-08-15 → 2026-09-05 outage lasted three weeks because nothing
  # reported it: the VPS build was OOM-killed silently, deploys were triggered
  # manually and rarely, and 23 commits sat unshipped with the site looking
  # perfectly healthy. A red tick in the Actions tab is only noticed by someone
  # already looking at it, so failures are raised as an issue instead.
  notify-failure:
    needs: build
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          title="Deploy pipeline failing on main"
          # Reuse the open issue if there is one, so a run of consecutive
          # failures produces one thread rather than a pile of duplicates.
          existing=$(gh issue list --repo "$REPO" --state open --label deploy-failure \
                       --json number --jq '.[0].number // empty')
          body=$(printf '%s\n' \
            "The image build or deploy failed for commit \`${SHA}\`." \
            "" \
            "Run: ${RUN_URL}" \
            "" \
            "Production is unaffected — it keeps serving the last good image — but" \
            "**nothing new is shipping until this is fixed.**" \
            "" \
            "Worth checking first: the build secret guard (an empty" \
            "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY fails the build by design), then the" \
            "runner logs.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh label create deploy-failure --repo "$REPO" --color B60205 \
              --description "Image build or deploy failed on main" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$title" \
              --label deploy-failure --body "$body"
          fi
